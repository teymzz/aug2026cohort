<body>

    <input type="text" id="numberField1">
    <input type="text" id="numberField2">
    <button onclick="divide()">divide</button>
    <button onclick="add()">add</button>
    <div id="outputField"></div>
    
</body>

<script>

    let number1 = 4;
    let number2 = 2;
     
    console.log(number1 + number2);

    console.log(number1 * number2);

    console.log(number1 / number2);

    let myNumberField1 = document.getElementById('numberField1');
    let myNumberField2 = document.getElementById('numberField2');
    let outputField = document.getElementById('outputField');

    function divide() {
    
        let numberValue1 = +myNumberField1.value.trim();
        let numberValue2 = +myNumberField2.value.trim();
        let answer = numberValue1 / numberValue2


        outputField.innerHTML = `${numberValue1} / ${numberValue2} = ${answer}`;
        // numberValue = +numberValue
    }

    function add() {
    
        let numberValue1 = +myNumberField1.value.trim();
        let numberValue2 = +myNumberField2.value.trim();
        let answer = numberValue1 + numberValue2


        outputField.innerHTML = `${numberValue1} / ${numberValue2} = ${answer}`;
        // numberValue = +numberValue
    }

    

</script>
